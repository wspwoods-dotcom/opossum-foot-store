name: Store builds — iOS + Android

# Proves the store build compiles: iOS on a real Mac, Android on a Linux
# runner (this project sandbox cannot keep a Gradle daemon connection
# alive, so CI is the Android build home too). Signing and App Store
# upload slot in once the App Store Connect API key is added as secrets
# (Tanner's batched step) — this job builds unsigned on purpose.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm ci
      - name: Assemble the web bundle
        run: python3 assemble-www.py
      - name: Sync the iOS project
        working-directory: native
        run: npx cap sync ios
      - name: Compile (unsigned, simulator SDK)
        working-directory: native/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20
      - name: Archive (unsigned)
        working-directory: native/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/OpossumFoot.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: OpossumFoot-xcarchive
          path: ${{ runner.temp }}/OpossumFoot.xcarchive

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm ci
      - name: Assemble the web bundle
        run: python3 assemble-www.py
      - name: Sync the Android project
        working-directory: native
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: OpossumFoot-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk

  # Signed App Store build, uploaded to TestFlight. Deliberate act only:
  # this job runs when the workflow is dispatched by hand, never on a
  # push (pushes still run the two unsigned proof jobs above, untouched).
  # Signing is MANUAL, because automatic signing at archive time demands
  # an iOS App Development provisioning profile, which needs a
  # registered device on the team (run #9 failed on exactly that: "Your
  # team has no devices from which to generate a provisioning profile").
  # Instead a fastlane lane uses the App Store Connect API key (ASC_*
  # repo secrets) to fetch an Apple Distribution certificate into a
  # temporary keychain plus an App Store provisioning profile — App
  # Store profiles need no devices. The build number is the workflow
  # run number, so every upload is unique; the marketing version stays
  # 1.0.0.
  ios-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm ci
      - name: Assemble the web bundle
        run: python3 assemble-www.py
      - name: Sync the iOS project
        working-directory: native
        run: npx cap sync ios
      - name: Place the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Fetch signing assets (distribution cert + App Store profile)
        working-directory: native/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          fastlane signing_assets
          security cms -D -i build/profiles/OpossumFoot-AppStore.mobileprovision > $RUNNER_TEMP/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist)
          echo "App Store profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Archive (signed, manual signing)
        working-directory: native/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/OpossumFoot.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=VRV4XC9F44 \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export the IPA
        working-directory: native/ios/App
        run: |
          python3 - "$PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist" <<'PYEOF'
          import plistlib
          import sys
          options = {
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {"com.opossumfoot.app": sys.argv[1]},
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": "VRV4XC9F44",
              "uploadSymbols": True,
          }
          with open(sys.argv[2], "wb") as handle:
              plistlib.dump(options, handle)
          PYEOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/OpossumFoot.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: OpossumFoot-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
